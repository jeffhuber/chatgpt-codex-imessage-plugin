name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --requirement requirements-mcp.txt
      - run: >-
          python -m py_compile
          bin/helper.py bin/send_gate.py
          plugin_server/bridge.py plugin_server/server.py
          tools/doctor.py tools/check_version.py tools/configure_allowlist.py
          tools/check_shared_core.py tools/install_plugin_manifest.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_shared_core.py
      - run: bash -n install.sh install-hardened.sh install-plugin.sh uninstall.sh uninstall-hardened.sh scripts/run-mcp-server.sh tools/bridge_paths.sh tools/select_python.sh
      - run: shellcheck install.sh install-hardened.sh install-plugin.sh uninstall.sh uninstall-hardened.sh scripts/run-mcp-server.sh tools/bridge_paths.sh tools/select_python.sh
      - run: python tools/check_version.py v1.2.1
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-mcp.txt
      - run: python -m unittest discover -s tests -v
      - run: plutil -lint com.jeffhuber.chatgpt-codex-imessage.plist.template
      - name: Compile FDA wrapper
        run: >-
          clang -Wall -Wextra -Werror -O2
          -DHELPER_SCRIPT='"/tmp/helper.py"'
          -DSEND_GATE_SCRIPT='"/tmp/send_gate.py"'
          -DCONFIRM_HELPER='"/tmp/chatgpt-codex-imessage-confirm"'
          -DBRIDGE_ROOT='"/tmp/imessage-bridge"'
          -DPYTHON_INTERPRETER='"/usr/bin/python3"'
          -DHELPER_DISPLAY_NAME='"chatgpt-codex-imessage-helper"'
          -DHOST_DISPLAY_NAME='"ChatGPT/Codex"'
          -fsyntax-only bin/imessage_helper.c
      - name: Compile native confirmation helper
        run: >-
          clang -Wall -Wextra -Werror -fobjc-arc
          -framework AppKit -framework Foundation
          -o /tmp/chatgpt-codex-imessage-confirm bin/confirm_imessage_send.m
