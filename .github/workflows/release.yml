name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-mcp.txt
      - name: Verify signed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_OBJECT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')"
          VERIFIED="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT" \
            --jq '.verification.verified == true and .verification.reason == "valid"')"
          test "$VERIFIED" = "true"
      - name: Verify tag and source versions
        run: IMESSAGE_TEST_PYTHON="$(command -v python)" ./tools/test.sh "$GITHUB_REF_NAME"
      - name: Run release checks
        run: |
          brew install shellcheck
          bash -n install.sh install-hardened.sh install-plugin.sh uninstall.sh uninstall-hardened.sh scripts/run-mcp-server.sh tools/bridge_paths.sh tools/select_python.sh tools/test.sh
          shellcheck install.sh install-hardened.sh install-plugin.sh uninstall.sh uninstall-hardened.sh scripts/run-mcp-server.sh tools/bridge_paths.sh tools/select_python.sh tools/test.sh
          plutil -lint com.jeffhuber.chatgpt-codex-imessage.plist.template
          clang -Wall -Wextra -Werror -O2 \
            -DHELPER_SCRIPT='"/tmp/helper.py"' \
            -DSEND_GATE_SCRIPT='"/tmp/send_gate.py"' \
            -DCONFIRM_HELPER='"/tmp/chatgpt-codex-imessage-confirm"' \
            -DBRIDGE_ROOT='"/tmp/imessage-bridge"' \
            -DPYTHON_INTERPRETER='"/usr/bin/python3"' \
            -DHELPER_DISPLAY_NAME='"chatgpt-codex-imessage-helper"' \
            -DHOST_DISPLAY_NAME='"ChatGPT/Codex"' \
            -fsyntax-only bin/imessage_helper.c
          clang -Wall -Wextra -Werror -fobjc-arc \
            -framework AppKit -framework Foundation \
            -o /tmp/chatgpt-codex-imessage-confirm bin/confirm_imessage_send.m
      - name: Build checksummed source archives
        run: |
          mkdir -p dist
          PREFIX="chatgpt-codex-imessage-plugin-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="$PREFIX/" \
            -o "dist/$PREFIX.tar.gz" "$GITHUB_SHA"
          git archive --format=zip --prefix="$PREFIX/" \
            -o "dist/$PREFIX.zip" "$GITHUB_SHA"
          (cd dist && shasum -a 256 "$PREFIX.tar.gz" "$PREFIX.zip" > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false
